name: Actualizar datos oficiales IGAE y AEAT

on:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-igae:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar lector de PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Validar datos antes de actualizar
        run: npm run validate:data
      - name: Buscar el último informe mensual y actualizar la serie IGAE
        run: npm run data:refresh
      - name: Leer el informe mensual de recaudación AEAT del mismo mes
        run: npm run data:refresh:aeat
      - name: Validar sumas, saldo, fuentes y periodos
        run: npm run validate:data
      - name: Archivar el panel si todas las fuentes mensuales coinciden
        run: npm run data:snapshot
      - name: Comprobar compilación de producción
        run: npm run build
      - name: Guardar una nueva versión si cambiaron las cifras
        run: |
          if [ -z "$(git status --porcelain -- data/igae-latest.json data/recaudacion-tributaria-2025.json data/provenance data/history data/dashboard-periods.json)" ]; then
            echo "Las publicaciones IGAE y AEAT no han cambiado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/igae-latest.json data/recaudacion-tributaria-2025.json data/provenance data/history data/dashboard-periods.json
          git commit -m "Actualiza datos oficiales del panel mensual"
          git push
