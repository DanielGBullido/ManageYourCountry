name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reglas del simulador e importadores
        run: npm test
      - name: El tema oscuro generado está al día
        run: node scripts/build-dark-theme.mjs --check
      - name: Sumas, fuentes y periodos de los datos
        run: npm run validate:data
      - name: Instalar el navegador para las pruebas de interfaz
        run: npx playwright install --with-deps chromium
      - name: Compilar y probar la interfaz (escritorio y móvil, con axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
